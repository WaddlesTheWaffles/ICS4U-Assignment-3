<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="maintitle">Formula Calculators</h1>

    <div class="formulacalculators">

        <div class="heron">
            <h2>Heron's Formula</h2>
            <label for="sidea" class="inheron">Side A:</label>
            <input type="text" name="sidea" id="sidea" class="inheron"><br><br>
            <label for="sideb" class="inheron">Side B:</label>
            <input type="text" name="sideb" id="sideb" class="inheron"><br><br>
            <label for="sidec" class="inheron">Side C:</label>
            <input type="text" name="sidec" id="sidec" class="inheron"><br><br>

            <label for="heroncalc" class="inheron">Area:</label>
            <textarea readonly name="area" id="heroncalc" cols="20" rows="1" class="inheron"></textarea><br><br>

            <input type="submit" value="Calculate" id="heroncalcbutton"  class="inheron">
        </div>

        <div class="ambiguous">
            <h1>Ambiguous Case</h2>
        </div>

        <div class="newton">
            <h2>Newton's Method</h2>
        </div>

        <div class="polynomial">
            <h2>Polynomial Function</h2>
        </div>

    </div>
</body>

</html>
